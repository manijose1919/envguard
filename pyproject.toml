[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard-cli"
version = "1.1.0"
description = "Environment variable drift detector: cross-references env vars your code uses against your .env files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "manijose1919" }]
keywords = ["dotenv", "env", "environment-variables", "lint", "ci", "drift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
envguard = "envguard.cli:main"

[project.urls]
Repository = "https://github.com/manijose1919/envguard"

[tool.setuptools.packages.find]
include = ["envguard*"]

[tool.setuptools.package-data]
envguard = ["static/*.html"]
